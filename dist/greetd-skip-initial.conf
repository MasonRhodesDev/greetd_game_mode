# Shipped by game-mode. On a plain boot (game mode not armed) mark greetd as
# "already started" so it goes straight to the greeter instead of running the
# initial session and then waiting out its one second minimum session length.
# The leading "-" keeps greetd starting even if the helper fails.
[Service]
ExecStartPre=-/usr/bin/game-mode-dispatch --pre-greetd

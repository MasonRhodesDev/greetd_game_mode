name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    uses: MasonRhodesDev/packaging-workflows/.github/workflows/release.yml@d85cbe2888dc868016c85452f7c339405b8528c1
    secrets: inherit
    with:
      spec-name: game-mode
      security: true
      # vigil (the greeter this package depends on) ships from [mason].
      extra-repos: |
        [mason]
        SigLevel = Required DatabaseRequired
        Server = https://masonrhodesdev.github.io/arch-repo/x86_64
      extra-repo-key-url: https://masonrhodesdev.github.io/arch-repo/mason-repo.asc
      extra-repo-key-fingerprint: 41450EEF8CEE7AB8CD3896221284404A6B70485C
